services:
  gitea:
    image: docker.gitea.com/gitea:latest
    container_name: gitea
    restart: unless-stopped

    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=gitea.home.arpa
      - GITEA__server__ROOT_URL=https://gitea.home.arpa/
      - GITEA__server__SSH_DOMAIN=gitea.home.arpa
      - GITEA__server__SSH_PORT=2222

    ports:
      - "3000:3000"
      - "2222:22"

    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

volumes:
  gitea_data:
